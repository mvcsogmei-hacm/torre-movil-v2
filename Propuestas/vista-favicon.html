<!doctype html>

<style>
  body{

  svg{ display:block; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Favicon de "La torre"</h1>

    <figure>

    <figure>

      <figcaption>32px (favoritos)</figcaption>
    </figure>
    <figure>
      <svg width="128" height="128" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#A6D3C4"/><path fill="#141816" d="M17 12h7v6h5v-6h6v6h5v-6h7v12l-5 5v13l5 7v7H17v-7l5-7V29l-5-5z"/></svg>
      <figcaption>128px (detalle)</figcaption>
    </figure>
  </div>
  <p>Este mismo icono debería aparecer también en la pestaña de esta página. Si no lo ves, prueba a recargar con Ctrl+F5.</p>
</div>
